version: "3.9"

# =============================================================================
# VoxPME — docker-compose (section 13.6)
# Asterisk reste en network_mode host (SIP/RTP) ; le reste sur un réseau bridge.
# =============================================================================

networks:
  voxpme-net:
    driver: bridge

volumes:
  postgres_data:
  asterisk_sounds:
  asterisk_certs:
  nginx_certs:
  grafana_data:
  prometheus_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — ARA + schéma applicatif
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:14
    container_name: voxpme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Dump/schéma existant, si tu en as un (restauré au tout premier démarrage
      # uniquement, si le volume est vide) :
      # - ./postgres/dump.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      #
      # Création du rôle applicatif voxpme_app — NON activé par défaut,
      # contenu à confirmer/adapter (voir postgres/init/01-create-voxpme-app-role.sql) :
      # - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - voxpme-net
    # Nécessaire car asterisk tourne en network_mode: host et ne peut pas
    # résoudre "postgres" via le DNS interne Docker : il se connecte donc
    # en 127.0.0.1:5432, comme dans la config VM d'origine.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis — état temps réel (appels en cours, pub/sub dashboard)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: voxpme-redis
    restart: unless-stopped
    networks:
      - voxpme-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Asterisk — compilé from source, ARA via ODBC, AGI Python embarqué
  # network_mode: host => pas de "networks:" ni "ports:" possible sur ce service
  # ---------------------------------------------------------------------------
  asterisk:
    build:
      context: ./asterisk
    container_name: voxpme-asterisk
    restart: unless-stopped
    network_mode: host
    environment:
      ODBC_DSN_PASSWORD: ${ODBC_DSN_PASSWORD}
      AMI_PASSWORD: ${AMI_PASSWORD}
      # Utilisé par ivr_engine.py (AGI) — évite de dépendre du fallback en
      # dur dans le script, qui contient un mot de passe de dev.
      VOXPME_DB_DSN: "dbname=voxpme user=voxpme_app password=${ODBC_DSN_PASSWORD} host=127.0.0.1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - asterisk_sounds:/var/lib/asterisk/sounds/custom
      - asterisk_certs:/etc/asterisk/certs
      # config bootstrap statique (extconfig.conf, res_odbc.conf, pjsip.conf, odbc.ini)
      # ${ODBC_DSN_PASSWORD} y est substitué au démarrage par docker-entrypoint.sh
      - ./asterisk/config-bootstrap:/etc/asterisk/bootstrap:ro
      - ./asterisk/config-live:/etc/asterisk:rw
  # ---------------------------------------------------------------------------
  # Backend — FastAPI : API de provisioning + listener ARI + WebSocket dashboard
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: voxpme-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    environment:
      # backend est sur le réseau bridge "voxpme-net" (pas network_mode host),
      # donc il joint postgres via le nom de service Docker, pas 127.0.0.1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENC}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Asterisk est en network_mode host : le backend le joint via l'IP hôte
      ARI_URL: http://${HOST_IP}:8088
      ARI_USER: ${ARI_USER}
      ARI_PASSWORD: ${ARI_PASSWORD}
      # Cle API pour l'API de provisioning (section 13.9 / J22).
      PROVISIONING_API_KEY: ${PROVISIONING_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AMI_PASSWORD: ${AMI_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voxpme-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Frontend — React/Vue + SIP.js, servi en statique par nginx interne à l'image
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: voxpme-frontend
    restart: unless-stopped
    networks:
      - voxpme-net

  # ---------------------------------------------------------------------------
  # Reverse proxy — HTTPS + WSS (section 13.7), point d'entrée unique
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: voxpme-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend
    networks:
      - voxpme-net

  # ---------------------------------------------------------------------------
  # Supervision
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: voxpme-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - voxpme-net

  grafana:
    image: grafana/grafana:latest
    container_name: voxpme-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - voxpme-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: voxpme-cadvisor
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - voxpme-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: voxpme-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - voxpme-net
