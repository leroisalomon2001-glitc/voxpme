; VoxPME — manager.conf bootstrap (AMI)
; Utilisateur dedie au backend pour reload dialplan (section 13.9 / J22).
; ${AMI_PASSWORD} substitue au demarrage par docker-entrypoint.sh (envsubst),
; meme pattern que ODBC_DSN_PASSWORD.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[voxpme-backend]
secret = ${AMI_PASSWORD}
read = dialplan,system,command
write = dialplan,system,command
